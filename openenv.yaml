name: "CustomerSupportTicketResolutionEnv"
version: "1.0.0"
description: "Customer support ticket resolution environment with Next.js UI, FastAPI backend, and Gemini auto-agent support."
entrypoint: "backend.app.main:app"
difficulty_levels:
  - easy
  - medium
  - hard
action_space:
  type: "discrete"
  actions:
    - classify_ticket
    - respond
    - escalate
    - close_ticket
observation_space:
  type: "json"
reward_bounds:
  min: -1.0
  max: 1.0
api:
  reset: "/reset"
  step: "/step"
  state: "/state"
  auto_agent: "/agent/auto"
max_steps_per_episode: 7
task_files:
  - "tasks/easy.json"
  - "tasks/medium.json"
  - "tasks/hard.json"
