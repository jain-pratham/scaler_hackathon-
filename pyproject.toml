[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler-hackathon"
version = "0.1.0"
description = "Scaler Hackathon Project"
authors = [
  { name = "OpenEnv", email = "help_openenvhackathon@scaler.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"
